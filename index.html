
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>World Nations Simulator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101827;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 65px;
    background: #17243a;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #293b55;
}

header h2 {
    margin: 0;
    font-size: 19px;
}

.status {
    color: #43d99b;
    font-size: 13px;
}

main {
    display: flex;
    height: calc(100vh - 65px);
}

#map {
    flex: 1;
    background: #101827;
}

.sidebar {
    width: 280px;
    background: #17243a;
    padding: 20px;
    overflow-y: auto;
}

.panel {
    background: #22334d;
    padding: 15px;
    border-radius: 9px;
    margin-bottom: 15px;
}

.panel h3 {
    margin-top: 0;
}

button {
    background: #3478f6;
    color: white;
    border: none;
    padding: 11px;
    border-radius: 6px;
    cursor: pointer;
    width: 100%;
    margin-top: 8px;
}

button:hover {
    background: #5090ff;
}

#country {
    color: #54a0ff;
    font-size: 20px;
    font-weight: bold;
}

.leaflet-popup-content-wrapper {
    background: #17243a;
    color: white;
}

.leaflet-popup-tip {
    background: #17243a;
}

@media(max-width: 700px) {
    .sidebar {
        width: 190px;
        padding: 10px;
    }
}
</style>
</head>

<body>

<header>
    <h2>🌍 WORLD NATIONS SIMULATOR</h2>
    <span class="status">● SYSTEM ONLINE</span>
</header>

<main>
    <div id="map"></div>

    <aside class="sidebar">
        <div class="panel">
            <h3>🌎 Simulation</h3>
            <p>Status: <span id="status">Paused</span></p>
            <button onclick="startSimulation()">▶ Start</button>
            <button onclick="pauseSimulation()">⏸ Pause</button>
            <button onclick="resetSimulation()">↻ Reset</button>
        </div>

        <div class="panel">
            <h3>🏳️ Selected Nation</h3>
            <div id="country">None</div>
            <p id="details">Select a country on the map.</p>
        </div>

        <div class="panel">
            <h3>⚔️ Wars</h3>
            <p id="wars">No active wars</p>
        </div>

        <div class="panel">
            <h3>📊 World Statistics</h3>
            <p>Countries: <span id="count">Loading...</span></p>
            <p>Wars: 0</p>
        </div>
    </aside>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map', {
    worldCopyJump: true
}).setView([25, 10], 2);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 8
    }
).addTo(map);
    {
        attribution: '&copy; OpenStreetMap &copy; CARTO',
        maxZoom: 8
    }
).addTo(map);

let selectedCountry = null;
let simulationRunning = false;
let countryLayer;

const countryStyle = {
    color: '#60758e',
    weight: 1,
    fillColor: '#3478f6',
    fillOpacity: 0.25
};

function selectCountry(feature, layer) {
    const name =
        feature.properties.ADMIN ||
        feature.properties.name ||
        'Unknown';

    layer.on('click', function() {
        selectedCountry = name;

        document.getElementById('country').textContent = name;
        document.getElementById('details').textContent =
            'Selected nation: ' + name;

        layer.bindPopup(
            '<b>' + name + '</b><br>Selected nation'
        ).openPopup();
    });
}

fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
.then(response => {
    if (!response.ok) throw new Error('Map data unavailable');
    return response.json();
})
.then(data => {
    countryLayer = L.geoJSON(data, {
        style: countryStyle,
        onEachFeature: selectCountry
    }).addTo(map);

    document.getElementById('count').textContent =
        data.features.length;

    map.fitBounds(countryLayer.getBounds());
})
.catch(error => {
    document.getElementById('count').textContent = 'Error';
    console.error(error);
});

function startSimulation() {
    simulationRunning = true;
    document.getElementById('status').textContent = 'Running';
}

function pauseSimulation() {
    simulationRunning = false;
    document.getElementById('status').textContent = 'Paused';
}

function resetSimulation() {
    simulationRunning = false;
    selectedCountry = null;

    document.getElementById('status').textContent = 'Paused';
    document.getElementById('country').textContent = 'None';
    document.getElementById('details').textContent =
        'Select a country on the map.';
}
</script>

</body>
</html>
